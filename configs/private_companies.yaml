# Private Company and Pre-IPO Intelligence Registry
# =============================================================================
# Each entry defines a monitored company, its IPO status, official sources for
# monitoring, and its relationship map to public equities.
#
# IMPORTANT: Status classifications are based on officially confirmed public
# information only. Do not assume IPO intent without official evidence.
# Statuses must be reviewed and updated when monitoring runs produce new data.
#
# Status vocabulary:
#   private              - actively private, no known IPO activity
#   confidential_filing  - company has officially confirmed a confidential S-1/F-1 submission
#   public_filing        - S-1 or F-1 is live on SEC EDGAR
#   roadshow             - active investor roadshow underway
#   priced               - final offer price set, not yet trading
#   listed               - trading on an exchange
#   postponed            - IPO paused, may resume
#   withdrawn            - IPO formally cancelled
#   acquired             - company acquired before or instead of IPO
#
# Relationship types (public_peers, suppliers, partners):
#   direct_ownership     - public company holds an equity stake
#   commercial_partner   - major commercial/strategic agreement
#   supplier             - provides hardware, cloud, or critical services
#   customer             - significant revenue customer
#   competitor           - competes in same product market
#   sector_peer          - comparable public company for valuation
#   speculative_readthrough - inferred relationship, not directly confirmed
#
# Review date: 2026-06-19
# =============================================================================

