# ============================================================================
# Schedule configuration
# Times are in the user's local timezone (from user_profile.yaml)
# ============================================================================

morning_briefing:
  time: "08:45"
  days: [mon, tue, wed, thu, fri]
  description: Spain morning note covering overnight global moves, Europe open, and US setup

hourly_intraday:
  start: "14:30"
  end: "21:30"
  interval_minutes: 60
  days: [mon, tue, wed, thu, fri]
  description: US macro + cash-session intraday updates

breaking_alerts:
  enabled: true
  poll_interval_minutes: 5
  start: "08:00"
  end: "23:00"
  days: [mon, tue, wed, thu, fri]
  min_score_threshold: 0.80
  description: High-threshold breaking alerts during waking market hours

evening_recap:
  enabled: false
  time: "22:30"
  days: [mon, tue, wed, thu, fri]
  description: End-of-day market recap (future)
