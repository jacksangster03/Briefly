# ============================================================================
# Alert rules: thresholds for different alert types
# ============================================================================

breaking_alerts:
  min_final_score: 0.80
  material_update_min_final_score: 0.88
  max_per_hour: 3
  require_ticker: false
  min_factual_confidence: 0.65

  # Event types that qualify for breaking alerts at lower thresholds
  high_priority_types:
    - earnings
    - guidance
    - fda_decision
    - m_and_a
    - fed_decision
    - geopolitical
    - macro_release

  # Event types that need higher thresholds
  elevated_threshold_types:
    headline: 0.90
    company_news: 0.85
    news_search: 0.92

intraday_updates:
  min_final_score: 0.40
  max_events_per_update: 7
  min_novelty_score: 0.3
  continuation_min_final_score: 0.58
  continuation_min_novelty_score: 0.45

morning_briefing:
  max_themes: 5
  max_sector_events: 3
  max_watchlist_events: 8
  max_earnings: 10
  include_all_sector_etfs: true
