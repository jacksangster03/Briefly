# ============================================================================
# Interest weights: fine-grained topic/theme boosting
# These weights multiply the personal relevance score for events
# matching specific themes beyond sector/watchlist matching.
# ============================================================================

themes:
  ai_infrastructure: 1.0
  gpu_compute: 1.0
  large_language_models: 0.95
  cloud_computing: 0.85
  semiconductor_supply: 0.95
  drug_discovery: 0.90
  clinical_trials: 0.85
  obesity_drugs: 0.90
  neurotech: 0.90
  gene_therapy: 0.80
  fintech: 0.85
  digital_payments: 0.80
