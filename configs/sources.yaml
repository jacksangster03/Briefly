# ============================================================================
# Data source configuration and trust tiers
# ============================================================================

providers:
  finnhub:
    enabled: true
    tier: primary
    trust: high
    rate_limit_per_minute: 60
    capabilities: [quotes, company_news, market_news, earnings_calendar, company_profile]

  fred:
    enabled: true
    tier: primary
    trust: high
    rate_limit_per_minute: 120
    capabilities: [macro_series, economic_calendar]

  ecb:
    enabled: true
    tier: primary
    trust: highest
    capabilities: [macro_series, fx, rates, euro_area_macro]

  eurostat:
    enabled: true
    tier: primary
    trust: highest
    capabilities: [macro_series, inflation, labour, industrial_production, trade]

  bls:
    enabled: false
    tier: primary
    trust: highest
    capabilities: [macro_series, cpi, ppi, payrolls, unemployment]

  bea:
    enabled: false
    tier: primary
    trust: highest
    capabilities: [macro_series, gdp, income, spending]

  sec_edgar:
    enabled: true
    tier: primary
    trust: highest
    rate_limit_per_second: 10
    capabilities: [filings, insider_transactions]

  newsapi:
    enabled: false      # set true if NEWSAPI_KEY is provided
    tier: secondary
    trust: medium
    rate_limit_per_day: 100
    capabilities: [headlines, broad_news]

  yfinance:
    enabled: true       # no key needed, but unofficial
    tier: fallback
    trust: medium
    note: "Unofficial Yahoo Finance wrapper. Use as fallback only."
    capabilities: [quotes, history]

  polygon:
    enabled: false
    tier: premium
    trust: high
    capabilities: [quotes, trades, aggregates, news]

  alpaca:
    enabled: false
    tier: premium
    trust: high
    capabilities: [quotes, trades, paper_trading]

  x_twitter:
    enabled: false
    tier: experimental
    trust: low
    note: "Social signal layer. Disabled by default. Low factual confidence."
    capabilities: [social_sentiment, narrative_tracking]

# Trust tiers determine factual confidence floor
trust_tiers:
  highest: 0.95    # SEC filings, official releases
  high: 0.80       # Finnhub, FRED, Polygon, established wires
  medium: 0.55     # NewsAPI, yfinance
  low: 0.25        # Social, unverified sources
  experimental: 0.15

# IPO and private-company intelligence sources (no keys required)
ipo_sources:
  ipo_edgar:
    enabled: true
    tier: free
    trust: highest
    note: "SEC EDGAR EFTS + Submissions API. S-1/F-1/424B4/EFFECT/RW monitoring."
    capabilities: [ipo_filings, ipo_pricing, ipo_withdrawal, ipo_effectiveness]

  company_newsroom:
    enabled: true
    tier: free
    trust: high
    note: "Official company newsroom monitor. Allowlisted URLs only. robots.txt checked."
    capabilities: [ipo_announcement, funding_announcement]

  nasdaq_ipo_calendar:
    enabled: true
    tier: free
    trust: medium
    note: "Nasdaq unofficial IPO calendar API. Estimated dates only."
    capabilities: [ipo_calendar]

  fmp_ipo_calendar:
    enabled: false
    tier: premium
    trust: medium
    note: "Financial Modelling Prep IPO calendar. Requires FMP_API_KEY."
    capabilities: [ipo_calendar]
