services:
  briefly:
    build: .
    container_name: briefly-platform
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
    restart: unless-stopped
    command: python -m app.cli scheduler

  # One-shot morning briefing (use: docker compose run briefly-morning)
  briefly-morning:
    build: .
    container_name: briefly-morning
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
    command: python -m app.cli morning
    profiles: ["manual"]
