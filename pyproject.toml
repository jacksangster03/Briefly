[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "briefly"
version = "0.1.0"
description = "Briefly portfolio intelligence platform: market briefings, portfolio control, and delivery workflows."
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.4",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.31"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
ml = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
]
analytics = [
    "arch>=6.3.0",
    "quantstats>=0.0.62",
    "riskfolio-lib>=7.0.0",
]
trading = [
    "alpaca-py>=0.28.0",
]
all = [
    "briefly[yfinance,dev,ml,analytics,trading]",
]

[project.scripts]
mbb = "app.cli:cli"
briefly = "app.cli:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
