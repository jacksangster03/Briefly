[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-briefing-bot"
version = "0.1.0"
description = "Production-grade market intelligence messenger: morning briefings, intraday updates, breaking alerts."
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "apscheduler>=3.10.4",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.31"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
all = [
    "market-briefing-bot[yfinance,dev]",
]

[project.scripts]
mbb = "app.cli:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
